<meta name="theme-color" content="#171a1d" media="(prefers-color-scheme: dark)">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<body class="viewer">
  <div class="v-top">
    <a class="pill" href="./" aria-label="Volver a los planos">← Planos</a>
    <button class="pill" id="t-tags" aria-pressed="true">Medidas</button>
  </div>

  <div class="v-stage" id="stage">
    <div class="v-labels" id="labels"></div>
    <div class="hint" id="hint">Arrastrá para girar · pellizcá para acercar</div>
  </div>

  <div class="sheet" id="sheet">
    <div class="row" role="group" aria-label="Distribución">
      <span class="row-label">Opción</span>
      <button class="chip" id="lay-A2" data-l="A2" aria-pressed="true">A ajustada</button>
      <button class="chip" id="lay-A" data-l="A" aria-pressed="false">A original</button>
    </div>
    <div class="row" role="group" aria-label="Punto de vista">
      <span class="row-label">Vista</span>
      <button class="chip" id="v-iso" data-v="iso" aria-pressed="true">General</button>
      <button class="chip" id="v-entrada" data-v="entrada" aria-pressed="false">Entrada</button>
      <button class="chip" id="v-cocina" data-v="cocina" aria-pressed="false">Cocina</button>
      <button class="chip" id="v-balcon" data-v="balcon" aria-pressed="false">Balcón</button>
      <button class="chip" id="v-escritorio" data-v="escritorio" aria-pressed="false">Escritorio</button>
      <button class="chip" id="v-plan" data-v="plan" aria-pressed="false">Planta</button>
      <button class="chip" id="t-walls" aria-pressed="false">Muros bajos</button>
    </div>
    <details class="more" id="more">
      <summary class="small" style="cursor:pointer;min-height:32px;display:flex;align-items:center">Medidas de los muebles</summary>
      <dl class="legend num" id="legend"></dl>
      <p class="small">Escala real en metros. Muros, aberturas y cocina estimados del plano: verificar en obra.</p>
    </details>
  </div>

<script type="importmap">
{"imports":{
  "three":"./vendor/three/three.module.min.js",
  "three/addons/":"./vendor/three/addons/"
}}
</script>
<script type="module" src="assets/living3d.js"></script>
<noscript><p class="fallback">Este modelo necesita JavaScript activado.</p></noscript>
</body>
</html>
